<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon GO Event - Ticket Generator</title>
    <style>
        :root {
            --primary-color: #ffcb05;
            --secondary-color: #3b4cca;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f7;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .no-print {
            max-width: 800px;
            margin: 0 auto 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #444;
        }

        input, select {
            padding: 10px 14px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 76, 202, 0.1);
        }

        .btn-container {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--secondary-color);
            color: #fff;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: #2a359c;
        }

        .btn-print {
            background-color: #28a745;
            color: #fff;
        }

        .btn-print:hover {
            background-color: #218838;
        }

        /* PRINT STYLING */
        @media print {
            body {
                background: #fff;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
            .ticket-grid {
                display: grid;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .ticket-card {
                break-inside: avoid;
                page-break-inside: avoid;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .ticket-grid {
            display: grid;
            gap: 0px; 
            max-width: 210mm;
            margin: 0 auto;
            background: #fff;
        }

        .ticket-card {
            border: 1px dashed #777; 
            margin-top: -1px;  
            margin-left: -1px; 
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: #fff;
            text-align: center;
        }

        .ticket-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #555;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 4px;
            margin-bottom: 2px;
        }

        /* Container voor nummer met groter logo als achtergrond */
        .number-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            margin: 4px 0;
        }

        .bg-watermark {
            position: absolute;
            max-width: 95%;  /* Vergroot van 70% naar 95% voor een groter logo */
            max-height: 95%; 
            object-fit: contain;
            opacity: 0.12; 
            pointer-events: none;
        }

        .ticket-number {
            position: relative;
            font-size: 3rem;
            font-weight: 900;
            color: #111;
            letter-spacing: -1.5px;
            line-height: 1;
            text-decoration: underline; 
            z-index: 1;
        }

        .ticket-footer {
            font-size: 0.65rem;
            color: #666;
            width: 100%;
            border-top: 1px solid #e1e4e8;
            padding-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>🎟️ Pokémon GO Event - Ticket Generator</h1>
        <p>Genereer strakke tickets waarbij het logo groter op de achtergrond achter het nummer verschijnt.</p>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="eventName">Event Naam</label>
                <input type="text" id="eventName" value="GO WILD AREA">
            </div>

            <div class="form-group">
                <label for="eventDate">Datum</label>
                <input type="text" id="eventDate" value="ZATERDAG 14/11/2026">
            </div>

            <div class="form-group">
                <label for="eventWebsite">Website / URL</label>
                <input type="text" id="eventWebsite" value="WWW.POGO.GENT">
            </div>

            <div class="form-group">
                <label for="startNum">Startnummer</label>
                <input type="number" id="startNum" value="1">
            </div>

            <div class="form-group">
                <label for="endNum">Eindnummer</label>
                <input type="number" id="endNum" value="100">
            </div>

            <div class="form-group">
                <label for="cols">Kolommen per pagina</label>
                <select id="cols">
                    <option value="2">2 kolommen (groot)</option>
                    <option value="3">3 kolommen</option>
                    <option value="4" selected>4 kolommen (compact)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rows">Rijen per pagina</label>
                <select id="rows">
                    <option value="4">4 rijen</option>
                    <option value="5">5 rijen</option>
                    <option value="6" selected>6 rijen</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="imageInput">Upload Logo / Achtergrond Afbeelding</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-primary" onclick="generateTickets()">Genereer Tickets</button>
            <button class="btn-print" onclick="window.print()">🖨️ Afdrukken / PDF</button>
        </div>
    </div>

    <!-- Tickets raster -->
    <div id="ticketContainer" class="ticket-grid"></div>

    <script>
        let uploadedImageBase64 = '';

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    generateTickets();
                }
                reader.readAsDataURL(file);
            } else {
                uploadedImageBase64 = '';
                generateTickets();
            }
        });

        function generateTickets() {
            const eventName = document.getElementById('eventName').value;
            const eventDate = document.getElementById('eventDate').value;
            const eventWebsite = document.getElementById('eventWebsite').value;
            const startNum = parseInt(document.getElementById('startNum').value) || 1;
            const endNum = parseInt(document.getElementById('endNum').value) || 50;
            const cols = parseInt(document.getElementById('cols').value);
            const rows = parseInt(document.getElementById('rows').value);

            const container = document.getElementById('ticketContainer');
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            const cardHeight = Math.floor(270 / rows) + 'mm';
            
            let html = '';
            for (let i = startNum; i <= endNum; i++) {
                const formattedNum = String(i).padStart(3, '0');

                html += `
                    <div class="ticket-card" style="height: ${cardHeight};">
                        <div class="ticket-header">
                            <span>${eventName}</span>
                            <span style="font-size: 0.65rem; font-weight: normal; color: #666;">${eventDate}</span>
                        </div>
                        <div class="number-container">
                            ${uploadedImageBase64 ? `<img src="${uploadedImageBase64}" class="bg-watermark" alt="Watermark">` : ''}
                            <div class="ticket-number"><u>${formattedNum}</u></div>
                        </div>
                        <div class="ticket-footer">
                            <span>Gewonnen? Check</span>
                            <span>${eventWebsite}</span>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        window.onload = generateTickets;
    </script>
</body>
</html>
